<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Forkwood: grow from twig to treetop</title>
  <meta name="description" content="A one-touch browser game. Grow a living branch from twig to treetop: fork it, merge it, don't get reverted." />
  <meta name="theme-color" content="#f4ecd8" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Forkwood: grow from twig to treetop" />
  <meta property="og:description" content="A one-touch browser game. Fork your branch, merge for combos, grow a living tree from twig to treetop." />
  <meta property="og:url" content="https://ducvuathuduc.github.io/treetop-forkwood/" />
  <meta property="og:image" content="https://ducvuathuduc.github.io/treetop-forkwood/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Forkwood title card over a painted dawn meadow at the foot of a giant tree" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Forkwood: grow from twig to treetop" />
  <meta name="twitter:description" content="Fork your branch, merge for combos, don't get reverted. Plays in the browser, desktop and mobile." />
  <meta name="twitter:image" content="https://ducvuathuduc.github.io/treetop-forkwood/og.jpg" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2386c8ee'/%3E%3Cpath d='M32 58V34M32 40C22 34 20 24 22 16M32 40c10-6 12-16 10-24' stroke='%236a4329' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='6' fill='%2386d66b'/%3E%3Ccircle cx='42' cy='16' r='6' fill='%2386d66b'/%3E%3Ccircle cx='32' cy='34' r='4' fill='%23fbf6e9'/%3E%3C/svg%3E" />
  <link rel="preload" href="assets/fonts/fraunces-display.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/art/bg-dawn.webp" as="image" type="image/webp" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="state-title">
  <canvas id="game" aria-label="Forkwood game canvas"></canvas>

  <div id="topbar">
    <button id="btn-pause" class="icon" aria-label="Pause" title="Pause (P)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
    </button>
    <button id="btn-mute" class="icon" aria-label="Mute" title="Mute (M)">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ln" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ln" d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
  </div>

  <div id="metabar" class="metabar" hidden>
    <button id="btn-wallet" class="chip" aria-label="Acorns: open the shop"><span id="acorn-ico" class="ci"></span><span id="acorn-n" class="num">0</span></button>
    <button id="btn-lvl" class="chip" aria-label="Level and goals"><span class="lv">Lv <b id="lvl-n">1</b></span><span id="lvl-pips" class="pips"></span></button>
    <button id="btn-grove" class="chip grove" aria-label="Grove: streak, season, league, duels and profile"><span id="av-chip" class="avc"></span><span class="sk"><span class="fl"></span><b id="streak-n">0</b></span></button>
    <button id="btn-gift" class="chip gift" hidden><span id="gift-ico" class="ci"></span><span>Daily gift</span></button>
  </div>

  <section id="title" class="overlay show">
    <div class="title-card paper">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path class="wood" d="M32 60V36M32 40C24 34 20 26 20 16M32 40c8-6 12-14 12-24"/>
        <path class="leaf" d="M20 16c-7-2-10-8-9-13 6 0 10 5 9 13zM44 16c7-2 10-8 9-13-6 0-10 5-9 13z"/>
        <circle class="node" cx="32" cy="38" r="4.5"/>
      </svg>
      <h1 class="logo">Forkwood</h1>
      <p class="tagline">Grow a branch from twig to treetop.<br />Fork it, merge it, don&rsquo;t get reverted.</p>
      <ol class="howto" aria-label="How to play">
        <li><svg viewBox="0 0 40 40" aria-hidden="true"><path class="w" d="M20 36V20"/><ellipse class="bud" cx="20" cy="15" rx="5" ry="7"/><path class="ar" d="M7 16l-4 4 4 4M33 16l4 4-4 4"/></svg><span><b>Steer</b> into sunlight</span></li>
        <li><svg viewBox="0 0 40 40" aria-hidden="true"><path class="w" d="M20 37V24M20 24c-6-3-9-8-9-15M20 24c6-3 9-8 9-15"/><circle class="dot" cx="20" cy="24" r="3.5"/></svg><span><b>Tap</b> to fork in two</span></li>
        <li><svg viewBox="0 0 40 40" aria-hidden="true"><path class="w" d="M20 37V30M20 30c-7-3-9-9-9-14 0-4 4-8 9-10M20 30c7-3 9-9 9-14 0-4-4-8-9-10"/><circle class="gold" cx="20" cy="6" r="4"/></svg><span><b>Tap</b> again: merge for a combo</span></li>
      </ol>
      <p id="challenge" class="challenge" hidden></p>
      <button id="btn-play" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg><span id="btn-play-label">Grow</span></button>
      <button id="btn-stake" class="stake-chip" hidden aria-label="Change stake"></button>
      <div class="title-row">
        <button id="btn-quest" class="btn secondary"><span id="quest-ico" class="bi"></span>Quest map <span id="quest-n" class="qn"></span></button>
        <button id="btn-daily" class="btn secondary">Daily tree <span id="daily-best"></span></button>
      </div>
      <p id="title-best" class="best"></p>
      <div class="foot">
        <p class="controls"><kbd>&larr;</kbd><kbd>&rarr;</kbd> steer <kbd>space</kbd> fork / merge <kbd>P</kbd> pause <kbd>M</kbd> mute</p>
        <button id="btn-story" class="linkish" type="button">Story</button>
        <button id="btn-calm" class="switch" aria-pressed="false"><span class="knob" aria-hidden="true"></span><span class="lbl">Calm mode: off</span></button>
      </div>
    </div>
  </section>

  <nav id="dock" class="dock paper" aria-label="Progress" hidden>
    <button data-tab="goals"><span class="di"></span><span>Goals</span></button>
    <button data-tab="shop"><span class="di"></span><span>Shop</span></button>
    <button data-tab="charms"><span class="di"></span><span>Charms</span></button>
    <button data-tab="badges"><span class="di"></span><span>Badges</span></button>
    <button data-tab="profile"><span class="di"></span><span>Rings</span></button>
  </nav>

  <section id="meta" class="overlay" aria-label="Goals, shop and progress">
    <div class="panel paper meta-panel">
      <header class="meta-head">
        <div class="tabs" role="tablist">
          <button data-tab="goals" role="tab"><span class="ti"></span><span>Goals</span></button>
          <button data-tab="shop" role="tab"><span class="ti"></span><span>Shop</span></button>
          <button data-tab="charms" role="tab"><span class="ti"></span><span>Charms</span></button>
          <button data-tab="badges" role="tab"><span class="ti"></span><span>Badges</span></button>
          <button data-tab="profile" role="tab"><span class="ti"></span><span>Rings</span></button>
        </div>
        <button id="btn-meta-close" class="icon" aria-label="Close" title="Close (Esc)"></button>
      </header>
      <div id="meta-body" class="meta-body"></div>
    </div>
  </section>

  <section id="questmap" class="overlay" aria-label="Quest map and modes">
    <div class="panel paper meta-panel quest-panel">
      <header class="meta-head">
        <div class="tabs" role="tablist">
          <button data-qtab="map" role="tab"><span class="ti"></span><span>Quest map</span></button>
          <button data-qtab="modes" role="tab"><span class="ti"></span><span>Modes</span></button>
        </div>
        <p id="quest-stars" class="qstars"></p>
        <button id="btn-quest-close" class="icon" aria-label="Close" title="Close (Esc)"></button>
      </header>
      <p id="quest-chest" class="qchest"></p>
      <div id="quest-body" class="meta-body"></div>
    </div>
  </section>

  <section id="pause" class="overlay">
    <div class="panel paper small-panel">
      <h2>Paused</h2>
      <button id="btn-resume" class="btn primary">Keep growing</button>
      <button id="btn-menu-p" class="btn secondary">Menu</button>
    </div>
  </section>

  <section id="over" class="overlay">
    <div class="panel paper over-panel">
      <div class="over-left"><div class="print"><img id="card-img" alt="Your tree as a postcard" /></div></div>
      <div class="over-right">
        <p id="over-kicker" class="kicker"></p>
        <div id="over-stars" class="over-stars" hidden></div>
        <h2 id="over-height"></h2>
        <p id="over-score" class="over-score"></p>
        <p id="over-hash" class="hash"></p>
        <p id="over-tip" class="over-tip"></p>
        <div id="rewards" class="rewards" hidden>
          <p class="rw-line"><span id="rw-acorn-ico" class="rw-ico"></span><span class="rw-n">+<b id="rw-acorns">0</b></span><span id="rw-parts" class="rw-parts"></span></p>
          <div id="rw-goals" class="rw-goals"></div>
          <ul id="rw-stamps" class="rw-stamps" hidden></ul>
        </div>
        <div class="row">
          <button id="btn-next" class="btn primary" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg><span id="btn-next-label">Next level</span></button>
          <button id="btn-again" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4.5h-4.5"/></svg><span id="btn-again-label">Grow again</span> <kbd>R</kbd></button>
        </div>
        <div class="row small">
          <button id="btn-share" class="btn secondary">Share</button>
          <button id="btn-challenge" class="btn secondary" title="Send a duel link: same course, your rival tip">Duel</button>
          <button id="btn-save" class="btn secondary">Save PNG</button>
          <button id="btn-menu" class="btn secondary">Menu</button>
        </div>
        <p id="share-msg" class="share-msg" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="press" class="press" aria-hidden="true"><i class="roller"></i></div>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#1e1a16;background:#f4ecd8">Forkwood needs JavaScript.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
