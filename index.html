<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Forkwood: grow from twig to treetop</title>
  <meta name="description" content="A one-touch browser game. Grow a living branch from twig to treetop: fork it, merge it, don't get reverted." />
  <meta name="theme-color" content="#86c8ee" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Forkwood: grow from twig to treetop" />
  <meta property="og:description" content="A one-touch browser game. Fork your branch, merge for combos, grow a living tree from twig to treetop." />
  <meta property="og:url" content="https://ducvuathuduc.github.io/treetop-forkwood/" />
  <meta property="og:image" content="https://ducvuathuduc.github.io/treetop-forkwood/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Forkwood title screen: a branch growing up through sunlit sky" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Forkwood: grow from twig to treetop" />
  <meta name="twitter:description" content="Fork your branch, merge for combos, don't get reverted. Plays in the browser, desktop and mobile." />
  <meta name="twitter:image" content="https://ducvuathuduc.github.io/treetop-forkwood/og.jpg" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2386c8ee'/%3E%3Cpath d='M32 58V34M32 40C22 34 20 24 22 16M32 40c10-6 12-16 10-24' stroke='%236a4329' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='16' r='6' fill='%2386d66b'/%3E%3Ccircle cx='42' cy='16' r='6' fill='%2386d66b'/%3E%3Ccircle cx='32' cy='34' r='4' fill='%23fbf6e9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game" aria-label="Forkwood game canvas"></canvas>

  <div id="topbar">
    <button id="btn-pause" class="icon" aria-label="Pause" title="Pause (P)">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
    <button id="btn-mute" class="icon" aria-label="Mute" title="Mute (M)">
      <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <section id="title" class="overlay show">
    <div class="title-card">
      <h1 class="logo"><span class="logo-f">Fork</span><span class="logo-w">wood</span></h1>
      <p class="tagline">Grow a living branch from twig to treetop.</p>
      <ol class="howto" aria-label="How to play">
        <li><span class="dot d1"></span><b>Steer</b> into sunlight</li>
        <li><span class="dot d2"></span><b>Tap</b> to fork in two</li>
        <li><span class="dot d3"></span><b>Tap</b> again to merge: combo ×</li>
      </ol>
      <p id="challenge" class="challenge" hidden></p>
      <button id="btn-play" class="big">▶&nbsp; Grow</button>
      <button id="btn-daily" class="ghost"><svg class="sprout" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9M12 13C7 12 5 8 6 4c4 0 7 3 6 9zM12 11c1-4 4-6 7-6 0 4-3 6-7 6z"/></svg> Daily tree <span id="daily-best"></span></button>
      <p class="controls">keys: <b>← →</b> steer · <b>space</b> fork / merge · <b>P</b> pause · <b>M</b> mute</p>
      <p id="title-best" class="best"></p>
      <button id="btn-calm" class="link" aria-pressed="false">Calm mode: off</button>
    </div>
  </section>

  <section id="pause" class="overlay">
    <div class="panel small-panel">
      <h2>Paused</h2>
      <button id="btn-resume" class="big">Keep growing</button>
      <button id="btn-menu-p" class="ghost">Menu</button>
    </div>
  </section>

  <section id="over" class="overlay">
    <div class="panel over-panel">
      <div class="over-left"><img id="card-img" alt="Your tree" /></div>
      <div class="over-right">
        <p id="over-kicker" class="kicker"></p>
        <h2 id="over-height"></h2>
        <p id="over-score" class="over-score"></p>
        <p id="over-hash" class="hash"></p>
        <p id="over-tip" class="over-tip"></p>
        <div class="row">
          <button id="btn-again" class="big">↻&nbsp; Grow again <kbd>R</kbd></button>
        </div>
        <div class="row">
          <button id="btn-share" class="ghost">Share</button>
          <button id="btn-challenge" class="ghost" title="Copy a link to this exact course">Challenge</button>
          <button id="btn-save" class="ghost">Save PNG</button>
          <button id="btn-menu" class="ghost">Menu</button>
        </div>
        <p id="share-msg" class="share-msg"></p>
      </div>
    </div>
  </section>

  <noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff">Forkwood needs JavaScript.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
