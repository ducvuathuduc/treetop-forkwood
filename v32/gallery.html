<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forkwood · trap FX gallery (debug)</title>
<style>html,body{margin:0;background:#0b1029;color:#fff6e6;font:600 12px "Bricolage",system-ui,sans-serif}canvas{display:block}
#nav{position:fixed;right:6px;bottom:6px;display:flex;flex-wrap:wrap;gap:4px;max-width:380px;justify-content:flex-end;opacity:.85}
#nav a{color:#fff6e6;background:rgba(10,16,22,.6);padding:4px 7px;border-radius:10px;text-decoration:none}
@font-face{font-family:"Bricolage";src:url(assets/fonts/bricolage.woff2) format("woff2")}
@font-face{font-family:"Fraunces";src:url(assets/fonts/fraunces-display.woff2) format("woff2")}</style></head>
<body><canvas id="c"></canvas><div id="nav"></div>
<script type="module">
// Debug page (not linked from the game). ?trap=<id> shows one trap at 390x844 in three
// stacked panels: TELEGRAPH / ATTACK / HIT (plus ?state=idle for the idle beat).
// No ?trap: every trap in a grid. Stills are deterministic in time (own FX clock).
import { Renderer, drawBud } from './src/render.js';
import { drawTraps, drawTrapFx, drawTrapFxHud, useFx, newFx } from './src/render-traps-fx.js';
import { backdrop } from './src/backdrop.js';
import { PULSE, DOOR, GUST, CROW_WARN } from './src/traps.js';

const W = 560, q = new URLSearchParams(location.search);
const IDS = ['twig', 'pulse', 'door', 'gust', 'sap', 'lure', 'twins', 'tide', 'crow', 'boosts'];
const ZONE = { twig: 100, pulse: 120, door: 600, gust: 320, sap: 330, lure: 620, twins: 1000, tide: 1020, crow: 1300, boosts: 300 };
document.getElementById('nav').innerHTML = IDS.map((i) => `<a href="?trap=${i}">${i}</a>`).join('') + '<a href="?">all</a>';
if (navigator.webdriver) document.getElementById('nav').style.display = 'none';
const canvas = document.getElementById('c');
const R = new Renderer(canvas);
const ctx = R.ctx;

// ---- scenes: build a fake sim state per trap and state. Tip sits at world y = 0.
function base(cx = 280, forked = false) {
  const s = { t: 10, cy: 0, prevCy: 4, cx, tips: forked ? [{ x: cx - 40, staged: 3 }, { x: cx + 40, staged: 2 }] : [{ x: cx, staged: 0 }], traps: [], motes: [], events: [], pu: {}, shield: false, invuln: 0, heading: 0, speed: 200 };
  return s;
}
function scene(id, st) {
  let s, ev = [], focus = -60;
  const hit = (src, dmg = 26) => ev.push({ type: 'hit', x: s.tips[0].x, y: s.cy, dmg, src });
  switch (id) {
    case 'twig': {
      s = base(250);
      const tr = { kind: 'twig', x0: 190, x1: 310, y0: 140, y1: -160, t: 0, peak: 0, snapped: false };
      if (st === 'idle') s.cy = 260, s.prevCy = 264;
      if (st === 'tele') tr.t = 0.38;
      if (st === 'attack' || st === 'hit') { tr.snapped = true; tr.snapT = s.t - (st === 'attack' ? 0.18 : 0.12); ev.push({ type: 'snap', x: 250, y: 0 }); if (st === 'hit') hit('twig', 18); }
      s.traps.push(tr); focus = st === 'idle' ? 120 : -40; break;
    }
    case 'pulse': {
      s = base(150);
      const tr = { kind: 'pulse', y: -110, segs: [[0, 140, 0], [140, 280, 1], [280, 420, 0], [420, 560, 1]], period: 4.6, clock: 0 };
      tr.clock = st === 'idle' ? 4.6 * 0.6 : st === 'tele' ? 4.6 * 0.9 : 4.6 * 0.02;
      if (st === 'attack' || st === 'hit') tr.pre = 4.6 * 0.97;
      if (st === 'hit') { s.cy = -110; s.tips[0].x = 70; hit('pulse'); }
      s.traps.push(tr); focus = -90; break;
    }
    case 'door': {
      s = base(280);
      const tr = { kind: 'door', y: -110, door: [195, 365], sq: [26, 112], period: DOOR.period, clock: 0 };
      tr.clock = DOOR.period * (st === 'idle' ? 0.2 : st === 'tele' ? DOOR.open + DOOR.warn * 0.65 : DOOR.open + DOOR.warn + 0.01);
      if (st === 'attack' || st === 'hit') tr.pre = DOOR.period * (DOOR.open + DOOR.warn * 0.95);
      if (st === 'hit') { s.cy = -110; hit('door'); }
      s.traps.push(tr); focus = -90; break;
    }
    case 'gust': {
      s = base(330);
      const per = GUST.calm + GUST.warn + GUST.gust;
      const tr = { kind: 'gust', y0: 260, y1: -340, dir: 1, force: 110, per, clock: st === 'idle' ? 0.6 : st === 'tele' ? GUST.calm + GUST.warn * 0.6 : GUST.calm + GUST.warn + 0.6 };
      s.traps.push(tr, { kind: 'hedge', x0: W - 46, x1: W, y0: 240, y1: -320, side: 1 });
      if (st === 'hit') { s.tips[0].x = 500; hit('hedge', 22); }
      focus = -60; break;
    }
    case 'sap': {
      s = base(280);
      const tr = { kind: 'sap', x0: 205, x1: 355, y0: st === 'idle' || st === 'tele' ? -60 : 150, y1: st === 'idle' || st === 'tele' ? -380 : -170, on: st === 'attack' || st === 'hit' };
      if (st === 'idle') s.tips[0].x = 120;
      s.traps.push(tr); focus = -80; break;
    }
    case 'lure': {
      s = base(80);
      const wx = 170;
      s.traps.push({ kind: 'wall', x0: wx - 16, x1: wx + 16, y0: 230, y1: -240, lure: true }, { kind: 'cap', y: -240, x0: 0, x1: wx + 16, side: -1, wx });
      for (let i = 0; i < 4; i++) s.motes.push({ x: 80 + (i % 2) * 10, y: 160 - i * 70 - (st === 'idle' ? 0 : 220), kind: 'sun', r: 11, ph: i, taken: false, lure: true });
      if (st === 'idle') { s.cy = 380; s.prevCy = 384; s.tips[0].x = 360; }
      if (st === 'tele') s.cy = -60;
      if (st === 'attack' || st === 'hit') s.cy = -200;
      if (st === 'hit') hit('cap', 22);
      focus = st === 'idle' ? 120 : -130; break;
    }
    case 'twins': {
      s = base(280);
      const tr = { kind: 'twins', x: 280, y: st === 'idle' ? -420 : -150, r: 14, clock: st === 'attack' ? 4.4 : 1, w: 2.2, passed: false };
      if (st === 'hit') { tr.y = -6; s.tips[0].x = 252; hit('beetle', 24); }
      s.traps.push(tr); s.brambles = []; focus = st === 'idle' ? -200 : -80; break;
    }
    case 'tide': {
      s = base(280);
      const gap = st === 'idle' ? 260 : st === 'tele' ? 95 : 18;
      s.traps.push({ kind: 'tide', y0: 400, y1: -600, top: gap, v: 150, done: false });
      if (st === 'hit') hit('tide', 20);
      focus = 60; break;
    }
    case 'crow': {
      s = base(280, true);
      const tr = { kind: 'crow', y: -200, side: -1, st: 'perch', t: 0 };
      if (st === 'idle') { s.cy = 160; s.prevCy = 164; }
      if (st === 'tele') { tr.st = 'warn'; tr.t = 0.45; tr.x = 300; tr.yy = 0; tr.lane = 46; }
      if (st === 'attack' || st === 'hit') { tr.st = 'warn'; tr.t = 0.05; tr.x = 300; tr.yy = 0; tr.lane = 46; tr.steal = st === 'attack' ? 0.09 : 0.32; }
      s.traps.push(tr); focus = st === 'idle' ? -60 : -70; break;
    }
    case 'boosts': {
      s = base(280);
      for (let i = 0; i < 5; i++) s.motes.push({ x: 180 + i * 50, y: -90 - (i % 2) * 50, kind: 'sun', r: 11, ph: i, taken: false });
      if (st === 'idle') { s.shield = true; }
      if (st === 'tele') { s.pu.pollen = 4; }
      if (st === 'attack') { s.pu.rush = 2; }
      if (st === 'hit') { s.pu.ink = 4; ev.push({ type: 'collect', x: 230, y: -90, chain: 3, pts: 30 }); }
      focus = -40; break;
    }
  }
  return { s, ev, focus };
}

// ---- draw one panel
function vine(c, s, now) {
  for (const tip of s.tips) {
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(16,32,27,0.7)'; c.lineWidth = 13; c.beginPath(); c.moveTo(tip.x - 30, 420); c.bezierCurveTo(tip.x + 30, 260, tip.x - 20, 100, tip.x, s.cy); c.stroke();
    c.strokeStyle = '#5fd99a'; c.lineWidth = 8; c.stroke();
    c.strokeStyle = '#b8ffd6'; c.lineWidth = 2.5; c.stroke();
    c.save(); c.translate(tip.x, s.cy); drawBud(c, false); c.restore();
  }
}
function panel(id, st, px, py, pw, ph, label) {
  const { s, ev, focus } = scene(id, st);
  const fx = { floaters: [], hitStop: 0 }, cam = { trauma: 0 };
  let T = 100; const F = newFx(); useFx(F, () => T);
  const sc = Math.min(pw / 590, ph / 330) * 1.0, dpr = R.dpr;
  R.sc = sc; R.ox = px + pw / 2 - (W / 2) * sc; R.oy = py + ph * 0.55 - focus * sc;
  const topY = (py - R.oy) / sc, botY = (py + ph - R.oy) / sc;
  R.sapTarget = { x: px + pw - 70, y: py + 44 };
  const ui = { hud: true, calm: false };
  const crow = s.traps.find((t) => t.kind === 'crow');
  const frame = (final) => {
    ctx.save(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
    ctx.translate(px, py);
    backdrop.draw(ctx, pw, ph, { m: ZONE[id], camPx: ZONE[id] * 30, playL: R.ox - px, playR: R.ox - px + W * sc, t: T, calm: false });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
    ctx.translate(R.ox, R.oy); ctx.scale(sc, sc);
    drawTraps(R, ctx, s, s.t, topY, botY, false, fx, cam, ui);
    vine(ctx, s, s.t);
    for (const o of s.motes) if (!o.taken) R.drawMote(ctx, o, s.t, 0);
    drawTrapFx(R, ctx, s, s.t, 1 / sc, ui);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
    // mini sap meter so the streak has somewhere to go
    ctx.fillStyle = 'rgba(10,16,22,0.5)'; ctx.fillRect(px + pw - 130, py + 40, 110, 8);
    ctx.fillStyle = '#5fd99a'; ctx.fillRect(px + pw - 130, py + 40, 60, 8);
    drawTrapFxHud(R, ctx, ui);
    if (final) {
      ctx.font = '800 13px Bricolage, system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(10,16,22,0.55)';
      const tw = ctx.measureText(label).width + 18; ctx.beginPath(); ctx.roundRect(px + 10, py + 10, tw, 24, 12); ctx.fill();
      ctx.fillStyle = '#fff6e6'; ctx.fillText(label, px + 19, py + 27);
    }
    ctx.restore();
    fx.hitStop = 0; fx.floaters.length = 0;
  };
  // warm-up: pre-states (so warn->out transitions animate), then the events, then a short hold
  const tr0 = s.traps[0];
  if (tr0 && tr0.pre != null) { const c = tr0.clock; tr0.clock = tr0.pre; for (let i = 0; i < 3; i++) { frame(false); T += 1 / 60; } tr0.clock = c; }
  const warm = tr0 && tr0.pre != null ? 5 : 20;
  for (let i = 0; i < warm; i++) { frame(false); T += 1 / 60; s.t += 1 / 60; }
  if (crow && crow.steal != null) {
    // the crow was circling; now it steals (sim flips to 'stole' and emits crowsteal)
    crow.st = 'stole'; crow.t = 0; s.events = [{ type: 'crowsteal', x: 320, y: s.cy, lost: 5, sap: 16, pts: 120 }];
    frame(false); s.events = [];
    const n = Math.round(crow.steal * 60); for (let i = 0; i < n; i++) { T += 1 / 60; frame(false); }
  } else if (ev.length) {
    s.events = ev; frame(false); s.events = [];
    for (let i = 0; i < 7; i++) { T += 1 / 60; s.t += 1 / 60; frame(false); }
  }
  frame(true);
}

function run() {
  const cw = R.cw, ch = R.ch;
  ctx.setTransform(R.dpr, 0, 0, R.dpr, 0, 0); ctx.fillStyle = '#0b1029'; ctx.fillRect(0, 0, cw, ch);
  const one = q.get('trap');
  const states = q.get('state') ? [q.get('state')] : ['tele', 'attack', 'hit'];
  const NAMES = { idle: 'IDLE', tele: 'TELEGRAPH', attack: 'ATTACK', hit: 'HIT' };
  const BOOST = { idle: 'SHIELD BUBBLE', tele: 'MAGNET (POLLEN)', attack: 'ROCKET-VINE (RUSH)', hit: 'SCORE ×2 AURA + SEED COLLECT' };
  if (one) {
    const n = states.length, ph = ch / n;
    states.forEach((st, i) => panel(one, st, 0, i * ph, cw, ph - 2, `${one.toUpperCase()} · ${one === 'boosts' ? BOOST[st] : NAMES[st]}`));
  } else {
    const cols = 4, rows = IDS.length, pw = cw / cols, ph = Math.max(150, pw * 0.6);
    canvas.height = Math.round(rows * ph * R.dpr); canvas.style.height = rows * ph + 'px'; R.ch = rows * ph;
    IDS.forEach((id, r) => ['idle', 'tele', 'attack', 'hit'].forEach((st, c) => panel(id, st, c * pw, r * ph, pw - 2, ph - 2, `${id} · ${id === 'boosts' ? BOOST[st] : NAMES[st]}`)));
  }
  window.galleryReady = true;
}
// wait for fonts + crow atlas + plates, then draw (twice, so lazily streamed images land)
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => { try { await document.fonts.ready; } catch (e) {} run(); await wait(900); run(); await wait(600); run(); })();
</script></body></html>
